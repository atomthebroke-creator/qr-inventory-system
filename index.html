<!DOCTYPE html>
<html>
<head>
  <title>QR Inventory System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>📦 Scan OR Enter Part</h2>

<p id="status">Click below to start scanner</p>

<div id="reader" style="width:300px; margin:auto;"></div>

<button onclick="startScanner()" style="padding:10px 20px;">
  📷 Start Scanner
</button>

<br><br>

<!-- 🔥 MANUAL INPUT -->
<input type="text" id="manualPart" placeholder="Enter Part No manually" />

<button onclick="useManualPart()">Use Part</button>

<br><br>

<p><b>Selected Part:</b> <span id="part">None</span></p>

<input type="number" id="qty" placeholder="Enter Quantity" />

<br><br>

<button onclick="submitData()">Submit</button>

<script>
let partNo = "";
let scanner;

function startScanner() {
    document.getElementById("status").innerText = "Requesting camera...";

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {

            partNo = decodedText.trim();

            alert("Scanned: [" + partNo + "]");

            document.getElementById("part").innerText = partNo;
            document.getElementById("status").innerText = "✅ QR Scanned";
        }
    ).catch(err => {
        document.getElementById("status").innerText =
            "❌ Camera error. Please allow permission.";
    });
}

// 🔥 NEW FUNCTION FOR MANUAL ENTRY
function useManualPart() {

    let manualValue = document.getElementById("manualPart").value.trim();

    if (!manualValue) {
        alert("Enter a valid Part No");
        return;
    }

    partNo = manualValue;

    document.getElementById("part").innerText = partNo;
    document.getElementById("status").innerText = "✍️ Manual Part Selected";
}

function submitData() {

    let qty = document.getElementById("qty").value;

    if (!partNo) {
        alert("Scan or enter Part No first");
        return;
    }

    if (!qty || qty <= 0) {
        alert("Enter valid quantity");
        return;
    }

    fetch("https://script.google.com/macros/s/AKfycbwMN2fAttAA16dV_lJKxp7FmVXl0lfaidv1Vb2dI3_iqY6upMeFdqBnidTqjIcXwdQcEw/exec", {
        method: "POST",
        body: JSON.stringify({
            partNo: partNo,
            qty: qty
        })
    })
    .then(res => res.text())
    .then(data => alert(data));
}
</script>

</body>
</html>
