<!DOCTYPE html>
<html lang="en">
<head>
  <title>Inventory Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f0520;
      color:#fff;
      padding:20px;
      text-align:center;
    }

    input, button {
      width: 90%;
      padding: 12px;
      margin: 6px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
    }

    input { background:#1a0a2e; color:#fff; }
    button { background:#7c3aed; color:white; font-weight:bold; }

    #reader { margin-top:10px; }

    .ok  { color:#86efac; }
    .err { color:#f87171; }

    .box {
      background:#240d45;
      padding:15px;
      border-radius:12px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h2>📦 Inventory Scanner</h2>

<div class="box">
  <button onclick="toggleScanner()">Start Scanner</button>
  <div id="reader"></div>

  <input id="manualPart" placeholder="Enter part manually">
  <button onclick="useManual()">Use Part</button>
</div>

<div class="box">
  <h3 id="partDisplay">No part selected</h3>
  <p id="desc"></p>
  <p id="stock"></p>
</div>

<div class="box">
  <input id="dateUsed" type="date">

  <input id="empId" placeholder="Employee ID">
  <input id="empName" placeholder="Employee Name">
  <input id="wo" placeholder="Work Order">

  <input id="qty" type="number" placeholder="Quantity">

  <button onclick="submitData()">Submit</button>
</div>

<p id="status"></p>
<p id="lastEntry"></p>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwMN2fAttAA16dV_lJKxp7FmVXl0lfaidv1Vb2dI3_iqY6upMeFdqBnidTqjIcXwdQcEw/exec";   // 🔴 replace
const TOKEN = "12345";            // 🔴 replace

let scanner = null;
let scanning = false;
let partNo = "";
let currentStock = 0;
let minStock = 0;

// INIT
window.onload = () => {
  document.getElementById("dateUsed").value =
    new Date().toISOString().split("T")[0];
};

// SCANNER
function toggleScanner() {
  scanning ? stopScanner() : startScanner();
}

function startScanner() {
  scanner = new Html5Qrcode("reader");
  scanning = true;

  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 },
    (text) => {
      if (navigator.vibrate) navigator.vibrate(100);
      stopScanner();
      selectPart(text.trim());
    }
  ).catch(() => {
    setStatus("Camera error", "err");
    scanning = false;
  });
}

function stopScanner() {
  if (scanner) {
    scanner.stop().catch(()=>{});
    scanner = null;
  }
  scanning = false;
}

// MANUAL
function useManual() {
  const val = document.getElementById("manualPart").value.trim();
  if (!val) return alert("Enter part");
  selectPart(val);
}

// LOOKUP
function selectPart(no) {
  partNo = no;
  document.getElementById("partDisplay").innerText = no;
  setStatus("Checking part...", "");

  fetch(`${URL}?partNo=${encodeURIComponent(no)}&token=${TOKEN}`)
  .then(r => r.json())
  .then(d => {
    if (!d.success) {
      setStatus("Part not found", "err");
      return;
    }

    currentStock = d.remaining;
    minStock = d.minStock;

    document.getElementById("desc").innerText =
      d.description + " | Bin: " + d.bin;

    document.getElementById("stock").innerText =
      "Stock: " + d.remaining;

    if (d.remaining <= d.minStock) {
      setStatus("⚠️ Low stock", "err");
    } else {
      setStatus("Ready", "ok");
    }

    document.getElementById("qty").focus();
  })
  .catch(() => setStatus("Lookup error", "err"));
}

// SUBMIT
function submitData() {
  const qty = Number(document.getElementById("qty").value);
  const empId = document.getElementById("empId").value.trim();
  const empName = document.getElementById("empName").value.trim();
  const wo = document.getElementById("wo").value.trim();
  const dateUsed = document.getElementById("dateUsed").value;

  if (!partNo) return alert("Scan part first");
  if (!qty || qty <= 0) return alert("Invalid quantity");
  if (qty > currentStock) return alert("Not enough stock");
  if (!empId || !empName) return alert("Enter employee details");

  setStatus("Submitting...", "");

  fetch(URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      token: TOKEN,
      partNo,
      qty,
      wo,
      empId,
      empName,
      dateUsed: new Date(dateUsed + "T00:00:00+05:30").toISOString()
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      setStatus(`✔ Done | Remaining: ${d.remaining}`, "ok");

      document.getElementById("lastEntry").innerText =
        `Last Entry → ${partNo} | Qty: ${qty} | WO: ${wo}`;

      resetForm();
    } else {
      setStatus(d.error, "err");
    }
  })
  .catch(() => setStatus("Server error", "err"));
}

// RESET
function resetForm() {
  partNo = "";
  document.getElementById("partDisplay").innerText = "Scan next part";
  document.getElementById("desc").innerText = "";
  document.getElementById("stock").innerText = "";
  document.getElementById("qty").value = "";
  document.getElementById("wo").value = "";
}

// STATUS
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = type;
}
</script>

</body>
</html>
