<!DOCTYPE html>
<html lang="en">
<head>
  <title>Inventory Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f0520;
      color:#fff;
      margin:0;
      padding:10px;
    }

    h2 { text-align:center; }

    .box {
      background:#240d45;
      padding:14px;
      border-radius:14px;
      margin-bottom:12px;
    }

    input, button {
      width:100%;
      padding:16px;
      margin-top:8px;
      border-radius:12px;
      border:none;
      font-size:16px;
    }

    input { background:#1a0a2e; color:#fff; }
    button { background:#7c3aed; color:#fff; }

    #reader {
      width:100%;
      border-radius:12px;
      overflow:hidden;
    }

    .ok  { color:#86efac; }
    .err { color:#f87171; }

    #partDisplay {
      font-size:18px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h2>📦 Inventory Scanner</h2>

<div class="box">
  <div id="reader"></div>
  <button onclick="startScanner()">🔄 Scan Again</button>

  <input id="manualPart" placeholder="Type part & press Enter">
</div>

<div class="box">
  <div id="partDisplay">Scan a part</div>
  <div id="desc"></div>
  <div id="stock"></div>
</div>

<div class="box">
  <input id="dateUsed" type="date">
  <input id="empId" placeholder="Employee ID">
  <input id="empName" placeholder="Employee Name">
  <input id="wo" placeholder="Work Order">
  <input id="qty" type="number" placeholder="Quantity">

  <button onclick="submitData()">✅ Submit</button>
</div>

<p id="status"></p>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwMN2fAttAA16dV_lJKxp7FmVXl0lfaidv1Vb2dI3_iqY6upMeFdqBnidTqjIcXwdQcEw/exec";
const TOKEN = "12345";

let scanner = null;
let scanLocked = false;
let partNo = "";
let currentStock = 0;
let minStock = 0;

/* INIT */
window.onload = () => {
  document.getElementById("dateUsed").value =
    new Date().toISOString().split("T")[0];

  startScanner();

  document.getElementById("manualPart")
    .addEventListener("keypress", e => {
      if (e.key === "Enter") useManual();
    });
};

/* 📷 SCANNER (SCAN ONCE → STOP) */
function startScanner() {
  if (scanner) return;

  scanLocked = false;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 250 },
    (text) => {

      if (scanLocked) return;
      scanLocked = true;

      const cleaned = text.trim();

      if (navigator.vibrate) navigator.vibrate(100);

      console.log("Scanned:", cleaned);

      // show instantly
      document.getElementById("partDisplay").innerText = cleaned;
      document.getElementById("desc").innerText = "Loading...";

      // STOP scanner
      scanner.stop().then(() => {
        scanner = null;
      });

      // lookup
      selectPart(cleaned);
    }
  ).catch(() => setStatus("Camera blocked", "err"));
}

/* ⌨️ MANUAL */
function useManual() {
  const val = document.getElementById("manualPart").value.trim();
  if (!val) return;

  document.getElementById("manualPart").value = "";
  selectPart(val);
}

/* 🔍 LOOKUP */
function selectPart(no) {
  partNo = no;

  document.getElementById("partDisplay").innerText = no;
  document.getElementById("desc").innerText = "Loading...";
  document.getElementById("stock").innerText = "";

  setStatus("Checking...", "");

  fetch(`${URL}?partNo=${encodeURIComponent(no)}&token=${TOKEN}`)
  .then(res => res.text())
  .then(text => {

    let d;
    try { d = JSON.parse(text); }
    catch {
      setStatus("Server error", "err");
      document.getElementById("desc").innerText = "Invalid response";
      return;
    }

    if (!d.success) {
      setStatus("Part not found", "err");
      document.getElementById("desc").innerText = "Not found";
      return;
    }

    currentStock = d.remaining;
    minStock = d.minStock;

    document.getElementById("desc").innerText =
      d.description + " | Bin: " + d.bin;

    document.getElementById("stock").innerText =
      "Stock: " + currentStock;

    setStatus(
      currentStock <= minStock ? "⚠️ Low stock" : "Ready",
      currentStock <= minStock ? "err" : "ok"
    );

    document.getElementById("qty").focus();
  });
}

/* 📤 SUBMIT */
function submitData() {
  const qty = Number(document.getElementById("qty").value);
  const empId = document.getElementById("empId").value.trim();
  const empName = document.getElementById("empName").value.trim();
  const wo = document.getElementById("wo").value.trim();
  const dateUsed = document.getElementById("dateUsed").value;

  if (!partNo) return alert("Scan part first");
  if (!qty || qty <= 0) return alert("Invalid qty");
  if (qty > currentStock) return alert("Not enough stock");
  if (!empId || !empName) return alert("Enter employee");

  setStatus("Submitting...", "");

  fetch(URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      token: TOKEN,
      partNo,
      qty,
      wo,
      empId,
      empName,
      dateUsed: new Date(dateUsed).toISOString()
    })
  })
  .then(res => res.text())
  .then(text => {
    let d;
    try { d = JSON.parse(text); }
    catch { return setStatus("Server error", "err"); }

    if (d.success) {
      setStatus("✔ Done", "ok");
      resetForm();
    } else {
      setStatus(d.error, "err");
    }
  });
}

/* 🔄 RESET */
function resetForm() {
  partNo = "";
  scanLocked = false;

  document.getElementById("partDisplay").innerText = "Scan next part";
  document.getElementById("desc").innerText = "";
  document.getElementById("stock").innerText = "";
  document.getElementById("qty").value = "";
  document.getElementById("wo").value = "";
}

/* STATUS */
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = type;
}
</script>

</body>
</html>
