<!DOCTYPE html>
<html lang="en">
<head>
  <title>Inventory Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f0520;
      color:#fff;
      margin:0;
      padding:10px;
    }

    h2 {
      font-size:20px;
      margin-bottom:10px;
      text-align:center;
    }

    .box {
      background:#240d45;
      padding:14px;
      border-radius:14px;
      margin-bottom:12px;
    }

    input, button {
      width:100%;
      padding:16px;
      margin-top:8px;
      border-radius:12px;
      border:none;
      font-size:16px;
    }

    input {
      background:#1a0a2e;
      color:#fff;
    }

    button {
      background:#7c3aed;
      color:white;
      font-weight:bold;
    }

    button:active {
      background:#6d28d9;
    }

    /* 📱 BIG SCANNER */
    #reader {
      width:100%;
      margin-top:10px;
      border-radius:12px;
      overflow:hidden;
    }

    /* 📌 Sticky submit button */
    .sticky {
      position:fixed;
      bottom:10px;
      left:10px;
      right:10px;
      z-index:20;
    }

    .ok  { color:#86efac; }
    .err { color:#f87171; }

    #status {
      text-align:center;
      margin-top:8px;
      font-size:14px;
    }

    #partDisplay {
      font-size:18px;
      font-weight:bold;
    }

    #desc {
      font-size:13px;
      color:#c084fc;
    }

    #stock {
      font-size:14px;
      margin-top:4px;
    }
  </style>
</head>

<body>

<h2>📦 Inventory Scanner</h2>

<div class="box">
  <button onclick="startScanner()">📷 Start Camera</button>
  <div id="reader"></div>

  <input id="manualPart" placeholder="Type part & press Enter">
</div>

<div class="box">
  <div id="partDisplay">Scan a part</div>
  <div id="desc"></div>
  <div id="stock"></div>
</div>

<div class="box">
  <input id="dateUsed" type="date">

  <input id="empId" placeholder="Employee ID">
  <input id="empName" placeholder="Employee Name">
  <input id="wo" placeholder="Work Order">

  <input id="qty" type="number" placeholder="Quantity">
</div>

<div class="sticky">
  <button onclick="submitData()">✅ Submit</button>
</div>

<p id="status"></p>
<p id="lastEntry"></p>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwMN2fAttAA16dV_lJKxp7FmVXl0lfaidv1Vb2dI3_iqY6upMeFdqBnidTqjIcXwdQcEw/exec";
const TOKEN = "12345";

let scanner = null;
let partNo = "";
let currentStock = 0;
let minStock = 0;

// INIT
window.onload = () => {
  document.getElementById("dateUsed").value =
    new Date().toISOString().split("T")[0];

  // 📱 Auto open camera on mobile
  startScanner();

  // Enter key for manual input
  document.getElementById("manualPart").addEventListener("keypress", (e) => {
    if (e.key === "Enter") useManual();
  });
};

// CAMERA
function startScanner() {
  if (scanner) return;

  scanner = new Html5Qrcode("reader");

  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
    (text) => {
      if (navigator.vibrate) navigator.vibrate(100);
      selectPart(text.trim());
    }
  ).catch(() => setStatus("Camera blocked", "err"));
}

// MANUAL INPUT
function useManual() {
  const input = document.getElementById("manualPart");
  const val = input.value.trim();

  if (!val) return;

  selectPart(val);
  input.value = "";
}

// LOOKUP
function selectPart(no) {
  partNo = no;
  document.getElementById("partDisplay").innerText = no;
  setStatus("Checking...", "");

  fetch(`${URL}?partNo=${encodeURIComponent(no)}&token=${TOKEN}`)
  .then(r => r.text())
  .then(text => {
    let d;
    try { d = JSON.parse(text); } catch { return setStatus("Server error", "err"); }

    if (!d.success) return setStatus("Not found", "err");

    currentStock = d.remaining;
    minStock = d.minStock;

    document.getElementById("desc").innerText =
      d.description + " | Bin: " + d.bin;

    document.getElementById("stock").innerText =
      "Stock: " + currentStock;

    if (currentStock <= minStock) {
      setStatus("⚠️ Low stock", "err");
    } else {
      setStatus("Ready", "ok");
    }

    document.getElementById("qty").focus();
  });
}

// SUBMIT
function submitData() {
  const qty = Number(document.getElementById("qty").value);
  const empId = document.getElementById("empId").value.trim();
  const empName = document.getElementById("empName").value.trim();
  const wo = document.getElementById("wo").value.trim();
  const dateUsed = document.getElementById("dateUsed").value;

  if (!partNo) return alert("Scan part first");
  if (!qty || qty <= 0) return alert("Invalid qty");
  if (qty > currentStock) return alert("Not enough stock");
  if (!empId || !empName) return alert("Enter employee");

  setStatus("Submitting...", "");

  fetch(URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      token: TOKEN,
      partNo,
      qty,
      wo,
      empId,
      empName,
      dateUsed: new Date(dateUsed).toISOString()
    })
  })
  .then(r => r.text())
  .then(text => {
    let d;
    try { d = JSON.parse(text); } catch { return setStatus("Server error", "err"); }

    if (d.success) {
      setStatus("✔ Done", "ok");

      document.getElementById("lastEntry").innerText =
        `Last → ${partNo} | Qty ${qty}`;

      resetForm();
    } else {
      setStatus(d.error, "err");
    }
  });
}

// RESET
function resetForm() {
  partNo = "";
  document.getElementById("partDisplay").innerText = "Scan next part";
  document.getElementById("desc").innerText = "";
  document.getElementById("stock").innerText = "";
  document.getElementById("qty").value = "";
  document.getElementById("wo").value = "";
}

// STATUS
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = type;
}
</script>

</body>
</html>
