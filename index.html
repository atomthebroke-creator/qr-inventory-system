<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fast Inventory Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- no cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f0520;
      color:#fff;
      margin:0;
      padding:10px;
    }

    h2 { text-align:center; }

    .box {
      background:#240d45;
      padding:14px;
      border-radius:14px;
      margin-bottom:12px;
    }

    input, button {
      width:100%;
      padding:16px;
      margin-top:8px;
      border-radius:12px;
      border:none;
      font-size:16px;
    }

    input { background:#1a0a2e; color:#fff; }
    button { background:#7c3aed; color:#fff; }

    #reader {
      width:100%;
      border-radius:12px;
      overflow:hidden;
    }

    .sticky {
      position:fixed;
      bottom:10px;
      left:10px;
      right:10px;
    }

    .ok { color:#86efac; }
    .err { color:#f87171; }
  </style>
</head>

<body>

<h2>📦 Fast Scanner</h2>

<div class="box">
  <div id="reader"></div>
  <input id="manualPart" placeholder="Type part & press Enter">
</div>

<div class="box">
  <div id="partDisplay">Scan a part</div>
  <div id="desc"></div>
  <div id="stock"></div>
</div>

<div class="box">
  <input id="dateUsed" type="date">
  <input id="empId" placeholder="Employee ID">
  <input id="empName" placeholder="Employee Name">
  <input id="wo" placeholder="Work Order">
  <input id="qty" type="number" placeholder="Quantity">
</div>

<div class="sticky">
  <button onclick="submitData()">✅ Submit</button>
</div>

<p id="status"></p>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwMN2fAttAA16dV_lJKxp7FmVXl0lfaidv1Vb2dI3_iqY6upMeFdqBnidTqjIcXwdQcEw/exec";
const TOKEN = "12345";

let scanner;
let lastScan = "";
let lastScanTime = 0;
let partNo = "";
let currentStock = 0;
let minStock = 0;

/* INIT */
window.onload = () => {
  document.getElementById("dateUsed").value =
    new Date().toISOString().split("T")[0];

  startScanner();

  document.getElementById("manualPart")
    .addEventListener("keypress", e => {
      if (e.key === "Enter") useManual();
    });
};

/* FAST SCANNER */
function startScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 20,             // ⚡ faster scanning
      qrbox: { width: 280, height: 280 } // 🎯 bigger target
    },
    (text) => {

      const now = Date.now();
      const cleaned = text.trim();

      // 🧠 prevent duplicate scans within 2 sec
      if (cleaned === lastScan && (now - lastScanTime < 2000)) return;

      lastScan = cleaned;
      lastScanTime = now;

      if (navigator.vibrate) navigator.vibrate(80);

      console.log("SCAN:", cleaned);

      // ⚡ show instantly
      document.getElementById("partDisplay").innerText = cleaned;

      // lookup
      selectPart(cleaned);
    }
  ).catch(() => setStatus("Camera blocked", "err"));
}

/* MANUAL */
function useManual() {
  const val = document.getElementById("manualPart").value.trim();
  if (!val) return;

  document.getElementById("manualPart").value = "";
  selectPart(val);
}

/* LOOKUP */
function selectPart(no) {
  partNo = no;
  setStatus("Checking...", "");

  fetch(`${URL}?partNo=${encodeURIComponent(no)}&token=${TOKEN}`)
  .then(r => r.text())
  .then(text => {
    let d;
    try { d = JSON.parse(text); }
    catch { return setStatus("Server error", "err"); }

    if (!d.success) return setStatus("Not found", "err");

    currentStock = d.remaining;
    minStock = d.minStock;

    document.getElementById("desc").innerText =
      d.description + " | Bin: " + d.bin;

    document.getElementById("stock").innerText =
      "Stock: " + currentStock;

    setStatus(currentStock <= minStock ? "⚠️ Low stock" : "Ready",
              currentStock <= minStock ? "err" : "ok");

    document.getElementById("qty").focus();
  });
}

/* SUBMIT */
function submitData() {
  const qty = Number(document.getElementById("qty").value);
  const empId = document.getElementById("empId").value.trim();
  const empName = document.getElementById("empName").value.trim();
  const wo = document.getElementById("wo").value.trim();
  const dateUsed = document.getElementById("dateUsed").value;

  if (!partNo) return alert("Scan part first");
  if (!qty || qty <= 0) return alert("Invalid qty");
  if (qty > currentStock) return alert("Not enough stock");
  if (!empId || !empName) return alert("Enter employee");

  setStatus("Submitting...", "");

  fetch(URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      token: TOKEN,
      partNo,
      qty,
      wo,
      empId,
      empName,
      dateUsed: new Date(dateUsed).toISOString()
    })
  })
  .then(r => r.text())
  .then(text => {
    let d;
    try { d = JSON.parse(text); }
    catch { return setStatus("Server error", "err"); }

    if (d.success) {
      setStatus("✔ Done", "ok");
      resetForm();
    } else {
      setStatus(d.error, "err");
    }
  });
}

/* RESET */
function resetForm() {
  partNo = "";
  document.getElementById("partDisplay").innerText = "Scan next part";
  document.getElementById("desc").innerText = "";
  document.getElementById("stock").innerText = "";
  document.getElementById("qty").value = "";
  document.getElementById("wo").value = "";
}

/* STATUS */
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = type;
}
</script>

</body>
</html>
